[package]
name = "passbolt-app"
version = "0.1.0"
description = "Passbolt Desktop Application"
authors = ["Your Name <your.email@example.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = ["isolation"] }

[dependencies]
tauri = { version = "2.0", features = ["isolation", "test"] }
tauri-plugin-opener = "2.0"
keyring = "2.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rust-embed = { version = "8.0", features = ["include-exclude"] }
tauri-plugin-devtools = "2.0.0"
url = "2.5.8"
dirs = "6.0.0"

[features]
default = ["custom-protocol"]

# This feature is used used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"  
codegen-units = 1 
lto = true      
opt-level = "s"
strip = true
