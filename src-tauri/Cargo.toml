[package]
name = "passbolt-app"
version = "0.1.0"
description = "Passbolt Desktop Application"
authors = ["Your Name <your.email@example.com>"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80.0"

[build-dependencies]
tauri-build = { version = "2.5.6", features = ["isolation"] }

[dependencies]
tauri = { version = "2.10.3", features = ["isolation", "test"] }
tauri-plugin-opener = "2.5.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rust-embed = { version = "8.0", features = ["include-exclude"] }
# tauri-plugin-devtools = "2.1.0"  # disabled: tracing subscriber saturates main thread
url = "2.5.8"
dirs = "6.0.0"
regex-lite = "0.1"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = "0.3"

[features]
default = ["custom-protocol"]

# This feature is used used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"  
codegen-units = 1 
lto = true      
opt-level = "s"
strip = true
